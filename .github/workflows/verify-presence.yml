name: Verify anonymous presence service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/presence-worker.js"
      - "infra/wrangler.toml"
      - ".github/workflows/deploy-presence.yml"
      - ".github/workflows/verify-presence.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check presence endpoint
        shell: bash
        run: |
          payload="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            'https://econ-paper-monitor-presence.academic-door.workers.dev/presence?client_id=github-actions-smoke-20260727')"
          echo "$payload"
          python -c 'import json, sys; value=json.loads(sys.argv[1]); assert isinstance(value.get("online"), int) and value["online"] >= 1' "$payload"

      - name: Check independent scheduler liveness endpoint
        shell: bash
        run: |
          payload="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            'https://econ-paper-monitor-presence.academic-door.workers.dev/monitor-liveness')"
          echo "$payload"
          python - "$payload" <<'PY'
          import json
          import sys

          value = json.loads(sys.argv[1])
          assert value.get("schema_version") == 1
          assert value.get("state") in {"healthy", "stale"}
          assert value.get("checked_at")
          assert set(value.get("workflows") or {}) == {
              "Monitor Watchdog",
              "Fast Discovery",
              "Update Paper Monitor",
          }
          assert isinstance(value.get("stale_workflows"), list)
          PY

      - name: Check CNKI relay endpoint
        shell: bash
        run: |
          body="$(mktemp)"
          headers="$(mktemp)"
          set +e
          http_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --get \
            --data-urlencode 'url=https://rss.cnki.net/knavi/rss/JJYJ?pcode=CJFD,CCJD' \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            'https://econ-paper-monitor-presence.academic-door.workers.dev/cnki-rss')"
          curl_exit=$?
          set -e

          echo "CNKI relay HTTP status: $http_status"
          echo "CNKI relay diagnostic headers:"
          grep -Eia '^(HTTP/|content-type:|server:|cf-ray:|cf-error-type:)' "$headers" || true

          if [ "$curl_exit" -ne 0 ]; then
            echo "CNKI relay response body (first 4096 bytes):"
            head -c 4096 "$body" || true
            echo
            exit 1
          fi

          if [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            test "$(wc -c < "$body")" -gt 100
            grep -Eiq '<(rss|rdf:RDF|feed|channel)([ >:]|$)' "$body"
            exit 0
          fi

          echo "CNKI relay response body (first 4096 bytes):"
          head -c 4096 "$body" || true
          echo

          if [ "$http_status" = "530" ] && grep -Fqi 'error code: 1016' "$body"; then
            echo "::warning::Known #288 Cloudflare/CNKI transport boundary: relay returned HTTP 530 / 1016. Authoritative local CNKI publication is verified separately."
            exit 0
          fi

          exit 1
