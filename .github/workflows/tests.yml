name: Test Paper Monitor

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Generate Daily homepage contract fixtures
        shell: bash
        run: |
          DAILY_DATE=$(python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("data/daily").glob("*.json"), reverse=True):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              if isinstance(payload, list) and all(isinstance(item, dict) for item in payload):
                  print(path.stem)
                  break
          else:
              raise SystemExit("No valid canonical daily archive available")
          PY
          )
          python scripts/build_daily_vnext.py --date "$DAILY_DATE" --output docs/index.html --report "$RUNNER_TEMP/daily-home-report.json"
          python scripts/build_daily_vnext.py --date "$DAILY_DATE" --output docs/daily-vnext/index.html --report "$RUNNER_TEMP/daily-vnext-report.json"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build and validate Daily Door vNext
        shell: bash
        run: |
          DAILY_DATE=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d"))
          PY
          )
          DAILY_ARCHIVE_VALID=$(python - "$DAILY_DATE" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path("data/daily") / f"{sys.argv[1]}.json"
          try:
              valid = bool(json.loads(path.read_text(encoding="utf-8")))
          except (OSError, ValueError):
              valid = False
          print("1" if valid else "0")
          PY
          )
          if [ "$DAILY_ARCHIVE_VALID" != "1" ]; then
            DAILY_DATE=$(python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("data/daily").glob("*.json"), reverse=True):
              try:
                  if json.loads(path.read_text(encoding="utf-8")):
                      print(path.stem)
                      break
              except (OSError, ValueError):
                  continue
          else:
              raise SystemExit("No non-empty canonical daily archive available")
          PY
            )
            echo "Current Beijing date archive is not committed; using latest canonical archive ${DAILY_DATE}."
          fi
          python scripts/build_daily_vnext.py --date "$DAILY_DATE" --output "$RUNNER_TEMP/daily-vnext.html" --report "$RUNNER_TEMP/daily-vnext-report.json"
          python - <<'PY'
          import json
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "daily-vnext.html"
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "daily-vnext-report.json").read_text())
          parser = HTMLParser()
          parser.feed(output.read_text(encoding="utf-8"))
          html = output.read_text(encoding="utf-8")
          rendered = html.count('class="paper-entry"')
          assert rendered == report["final_render_count"], (rendered, report["final_render_count"])
          assert "data-count=\"" in html
          print(f"Daily vNext validated: {rendered} entries")
          PY
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from build_daily_vnext import search_text

          probe = {
              "title": "Visible title",
              "url": "https://example.test/article/abstract?id=123",
              "abstract": "ABSTRACT_LEAK_SENTINEL",
              "summary": "SUMMARY_LEAK_SENTINEL",
          }
          value = search_text(probe, [])
          assert "abstract_leak_sentinel" not in value
          assert "summary_leak_sentinel" not in value
          assert "article/abstract" in value
          print("Daily vNext search contract validated: hidden summary fields excluded; URL tokens allowed")
          PY
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync(process.env.RUNNER_TEMP + '/daily-vnext.html', 'utf8');
          const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map(match => match[1]).filter(Boolean);
          scripts.forEach(script => new Function(script));
          if (!html.includes('class="hero-lede"')) throw new Error('Hero lede missing');
          if (!html.includes('[data-motion="hero"]')) throw new Error('Hero motion target missing');
          if (html.includes('<div class="tags"></div>')) throw new Error('Empty tags container rendered');
          console.log(`Daily vNext JavaScript validated: ${scripts.length} inline scripts`);
          NODE
      - name: Verify Daily vNext template contract
        run: |
          python - <<'PY'
          from pathlib import Path
          template = Path('scripts/templates/daily_vnext.html').read_text(encoding='utf-8')
          required = ['data-motion="hero"', 'data-motion="title"', 'class="hero-lede"', 'data-motion="discovery"', 'data-motion="stat-line"']
          missing = [item for item in required if item not in template]
          assert not missing, missing
          assert 'const lede = hero.querySelector(\'.hero-lede\')' in template
          assert 'if (![left, right, eyebrow, title, lede, discovery, total, statLine].every(Boolean)) return;' in template
          print('Daily vNext template contract validated')
          PY
      - name: Verify empty Daily protection
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          probe = Path(os.environ["RUNNER_TEMP"]) / "daily-vnext-preserved.html"
          probe.write_text("previous-valid-page", encoding="utf-8")
          env = os.environ.copy()
          env.pop("ALLOW_EMPTY_DAILY", None)
          result = subprocess.run(
              [sys.executable, "scripts/build_daily_vnext.py", "--date", "2099-01-01", "--output", str(probe)],
              env=env,
              capture_output=True,
              text=True,
          )
          assert result.returncode != 0, result.stdout + result.stderr
          assert probe.read_text(encoding="utf-8") == "previous-valid-page"
          print("Empty Daily protection validated: previous HTML preserved")
          PY
      - name: Verify valid empty Daily renders calmly
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "daily-vnext-valid-empty.html"
          report = Path(os.environ["RUNNER_TEMP"]) / "daily-vnext-valid-empty.json"
          result = subprocess.run(
              [
                  sys.executable,
                  "scripts/build_daily_vnext.py",
                  "--date",
                  "2026-06-14",
                  "--output",
                  str(output),
                  "--report",
                  str(report),
              ],
              capture_output=True,
              text=True,
          )
          assert result.returncode == 0, result.stdout + result.stderr
          payload = json.loads(report.read_text(encoding="utf-8"))
          assert payload["final_render_count"] == 0
          assert "今日暂无新发现" in output.read_text(encoding="utf-8")
          print("Valid empty Daily rendered without exposing stale records")
          PY