name: Diagnose final JARE live source

on:
  push:
    branches:
      - probe/jare-final-170

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect JARE publisher response and production parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import sys
          sys.path.insert(0, 'scripts')
          import fetch_priority_toc as f

          url = 'https://jareonline.org/preprint-online/'
          text = f.fetch_toc_text(url, timeout=30)
          compact = re.sub(r'\s+', ' ', text[:1500]).strip()
          markers = {
              'length': len(text),
              'title': (re.search(r'<title[^>]*>(.*?)</title>', text, flags=re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>', text, flags=re.I|re.S) else None),
              'agecon_links': len(re.findall(r'ageconsearch\.umn\.edu', text, flags=re.I)),
              'elementor_titles': len(re.findall(r'elementor-heading-title', text, flags=re.I)),
              'published_online': len(re.findall(r'Published Online', text, flags=re.I)),
              'preprint': len(re.findall(r'preprint', text, flags=re.I)),
              'challenge': len(re.findall(r'challenge|captcha|access denied|verify you are human|just a moment|cf-chl', text, flags=re.I)),
              'is_challenge_page': f.is_challenge_page(text),
              'parsed_blocks': len(f.jare_advance_blocks(text, url)),
          }
          print('JARE_DIAG', json.dumps(markers, ensure_ascii=False, sort_keys=True))
          print('JARE_HEAD', compact)
          PY
