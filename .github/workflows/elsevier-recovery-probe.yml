name: Elsevier Recovery Probe

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Recovery candidate limit (0 = unlimited)"
        required: false
        default: "0"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/recover_metadata_batch.py"
      - ".github/workflows/elsevier-recovery-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dry-run recovery with Elsevier provider
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              LIMIT=50
            else
              LIMIT=0
            fi
          fi
          python scripts/recover_metadata_batch.py --dry-run \
            --limit "$LIMIT" \
            --recent-days 5000 --workers 8 --timeout 12 \
            --output /tmp/elsevier-probe.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/elsevier-probe.json', encoding='utf-8'))
          health = (report.get('provider_health') or {}).get('elsevier', {})
          keys = (
              'attempts',
              'available',
              'statuses',
              'rate_limited',
              'api_key_configured',
              'inst_token_configured',
              'rate_limit_headers',
          )
          print('elsevier_provider_health=' + json.dumps(
              {key: health.get(key) for key in keys}, ensure_ascii=False
          ))
          ss_health = (report.get('provider_health') or {}).get('semantic-scholar', {})
          ss_keys = (
              'attempts',
              'available',
              'statuses',
              'rate_limited',
              'skipped',
              'api_key_configured',
          )
          print('semantic_scholar_health=' + json.dumps(
              {key: ss_health.get(key) for key in ss_keys}, ensure_ascii=False
          ))
          pii_health = (report.get('provider_health') or {}).get('elsevier-pii', {})
          pii_keys = (
              'attempts',
              'available',
              'empty',
              'statuses',
              'failed',
              'api_key_configured',
              'rate_limit_headers',
          )
          print('elsevier_pii_provider_health=' + json.dumps(
              {key: pii_health.get(key) for key in pii_keys}, ensure_ascii=False
          ))
          print('recovery_candidates=' + json.dumps({
              'total': report.get('candidates'),
              'doi': report.get('doi_candidates'),
              'pii': report.get('pii_candidates'),
          }, ensure_ascii=False))
          print('recovery_recovered=' + json.dumps(
              report.get('recovered', {}), ensure_ascii=False
          ))
          print('recovery_shortfall=' + json.dumps(
              report.get('shortfall', {}), ensure_ascii=False
          ))
          PY
      - name: Inspect Elsevier Article API date fields
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: |
          python scripts/inspect_elsevier_dates.py \
            --data-dir data --limit 50 \
            --output /tmp/elsevier-date-inspection.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/elsevier-date-inspection.json', encoding='utf-8'))
          print('inspection_statuses=' + json.dumps(report.get('status_counts', {}), ensure_ascii=False))
          print('inspection_total=' + str(report.get('total')))
          for item in report.get('items', [])[:10]:
              print('sample=' + json.dumps(
                  {key: item.get(key) for key in ('doi', 'status', 'date_keys', 'date_values')},
                  ensure_ascii=False,
              ))
          PY
      - name: Upload Elsevier date-field inspection
        uses: actions/upload-artifact@v4
        with:
          name: elsevier-date-inspection
          path: /tmp/elsevier-date-inspection.json
