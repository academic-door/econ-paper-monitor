name: N4a search count one-shot patch

on:
  push:
    branches:
      - brain/n4a-search-filter-count-202

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/n4a-search-filter-count-202
      - name: Apply exact template patch and self-delete
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/n4a_patch.py
          python /tmp/n4a_patch.py
          rm .github/workflows/n4a-search-count-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/templates/daily_vnext.html .github/workflows/n4a-search-count-patch.yml
          git commit -m "Make Daily vNext filter counts search-aware"
          git push origin HEAD:brain/n4a-search-filter-count-202
