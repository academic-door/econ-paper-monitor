name: N4a secondary nav patch

on:
  push:
    branches:
      - brain/n4a-secondary-nav-label-202
    paths:
      - .github/workflows/n4a-secondary-nav-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/n4a-secondary-nav-label-202
          fetch-depth: 0
      - name: Apply guarded patch and remove executor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/render_site.py')
          text = path.read_text(encoding='utf-8')
          old = "    menu.setAttribute('aria-expanded', String(open));\n"
          new = old + "    menu.setAttribute('aria-label', open ? '关闭导航' : '打开导航');\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one secondary menu target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/n4a-secondary-nav-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render_site.py .github/workflows/n4a-secondary-nav-patch.yml
          git commit -m "N4a align secondary nav accessible name"
          git push origin HEAD:brain/n4a-secondary-nav-label-202
