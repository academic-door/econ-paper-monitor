name: Probe REStat Online Early from CI

on:
  push:
    branches:
      - probe/restat-online-early-ci

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare old and current REStat early URLs
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from common import load_journals
          from fetch_priority_toc import article_links, fetch_toc_text, fetch_target

          journal = next(j for j in load_journals(Path('data/journals.yml')) if j['id'] == 'review-of-economics-and-statistics')
          cases = [
              ('old', 'https://direct.mit.edu/rest/advance-articles'),
              ('online-early', 'https://direct.mit.edu/rest/online-early'),
          ]
          for label, url in cases:
              try:
                  text = fetch_toc_text(url, timeout=30, fallback_urls=[f"https://r.jina.ai/http://{url.removeprefix('https://')}"])
                  links = article_links(text, url)
                  print(f'{label}: len={len(text)} links={len(links)}')
                  for link, title in links[:5]:
                      print(f'{label}_sample={title[:100]} | {link}')
                  target = {
                      'kind': 'restat_advance',
                      'url': url,
                      'fallback_urls': [f"https://r.jina.ai/http://{url.removeprefix('https://')}"],
                      'date_source': 'mitpress_online_early',
                      'date_confidence': 'B',
                      'fallback_issn': '0034-6535',
                  }
                  records = fetch_target(journal, target, timeout=30, detail_limit=0, max_items=40)
                  print(f'{label}_records={len(records)}')
              except Exception as exc:
                  print(f'{label}_error={type(exc).__name__}: {exc}')
          PY
