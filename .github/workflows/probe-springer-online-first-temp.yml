name: Probe Springer Online First from CI

on:
  push:
    branches:
      - probe/springer-online-first-ci

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Springer RSS lexical defect
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from common import fetch_text

          url = 'https://link.springer.com/search.rss?query=&search-within=Journal&facet-journal-id=11127'
          text = fetch_text(url, timeout=30)
          print(f'length={len(text)}')
          lines = text.splitlines()
          for n in range(1, min(22, len(lines)) + 1):
              print(f'{n:02d}: {lines[n-1]!r}')
          print('line14_codepoints=', [hex(ord(ch)) for ch in lines[13][:80]] if len(lines) >= 14 else None)
          PY
