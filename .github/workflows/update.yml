name: Update Paper Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: light, full, or single"
        required: false
        default: "light"
      journal:
        description: "Journal id for mode=single"
        required: false
        default: ""
      days:
        description: "Crossref lookback days"
        required: false
        default: "14"
      recovery_limit:
        description: "Batch recovery candidate limit (0 = unlimited)"
        required: false
        default: "150"
  schedule:
    # Core discovery: broader priority tier once per hour, offset from the
    # dedicated 15-minute Fast Discovery workflow. Full-run hours replace core.
    - cron: "7 0-3,5-9,11-15,17-21,23 * * *"
    # Full discovery: all formal journals every six hours.
    # Beijing 00:00, 06:00, 12:00, and 18:00.
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"

permissions:
  actions: write
  contents: write
  issues: write

env:
  FULL_SCHEDULES: "0 16 * * *|0 22 * * *|0 4 * * *|0 10 * * *"

concurrency:
  group: paper-monitor-main-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure Beijing today file exists
        run: python scripts/ensure_today_daily.py
      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'light' }}"
          DAYS="${{ github.event.inputs.days || '14' }}"
          RECOVERY_LIMIT="${{ github.event.inputs.recovery_limit || '150' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 16 * * *"|"0 22 * * *"|"0 4 * * *"|"0 10 * * *")
                MODE="full"
                DAYS="45"
                ;;
            esac
          fi
          ROWS="8"
          DETAIL_LIMIT="0"
          CN_DETAIL_LIMIT="0"
          TRANSLATE_LIMIT="0"
          TRANSLATE_SECONDS="0"
          TIER="hourly"
          CROSSREF_WALL_TIMEOUT="8m"
          CROSSREF_REQUEST_TIMEOUT="8"
          CROSSREF_RETRIES="1"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$MODE" = "light" ]; then
            DAYS="10"
          fi
          if [ "$MODE" = "full" ]; then
            ROWS="40"
            DETAIL_LIMIT="120"
            CN_DETAIL_LIMIT="0"
            TIER=""
            CROSSREF_WALL_TIMEOUT="25m"
            CROSSREF_REQUEST_TIMEOUT="12"
            CROSSREF_RETRIES="2"
          fi
          if [ "$MODE" = "single" ]; then
            ROWS="60"
            DETAIL_LIMIT="25"
            TIER=""
            CROSSREF_WALL_TIMEOUT="15m"
            CROSSREF_REQUEST_TIMEOUT="12"
            CROSSREF_RETRIES="2"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "recovery_limit=$RECOVERY_LIMIT" >> "$GITHUB_OUTPUT"
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          echo "detail_limit=$DETAIL_LIMIT" >> "$GITHUB_OUTPUT"
          echo "cn_detail_limit=$CN_DETAIL_LIMIT" >> "$GITHUB_OUTPUT"
          echo "translate_limit=$TRANSLATE_LIMIT" >> "$GITHUB_OUTPUT"
          echo "translate_seconds=$TRANSLATE_SECONDS" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "crossref_wall_timeout=$CROSSREF_WALL_TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "crossref_request_timeout=$CROSSREF_REQUEST_TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "crossref_retries=$CROSSREF_RETRIES" >> "$GITHUB_OUTPUT"
      - name: Scheduled core admission
        id: watchdog
        if: github.event_name == 'schedule' && !contains(env.FULL_SCHEDULES, github.event.schedule)
        shell: bash
        run: |
          echo "decision=run" >> "$GITHUB_OUTPUT"
          echo "Scheduled core discovery: run"
      - name: Check Elsevier secrets configured
        run: |
          echo "elsevier_api_key_configured=${{ secrets.ELSEVIER_API_KEY != '' }}"
          echo "elsevier_inst_token_configured=${{ secrets.ELSEVIER_INST_TOKEN != '' }}"
      - name: Build source registry
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/build_source_registry.py
      - name: Enrich journals
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout 5m python scripts/enrich_journals.py --rows 3 --timeout 8 --sleep 0.05; then
            echo "Journal registry enrichment completed."
          else
            echo "::warning::Journal registry enrichment timed out or failed; continuing with cached journal configuration."
          fi
      - name: Fetch RSS feeds
        if: steps.mode.outputs.mode != 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        run: python scripts/fetch_rss.py --tier "${{ steps.mode.outputs.tier }}"
      - name: Fetch AEA journal TOCs
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: timeout 5m python scripts/fetch_aea.py --tier "${{ steps.mode.outputs.tier }}" --detail-limit 10 --max-items-per-journal 30
      - name: Fetch priority publisher TOCs
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        shell: bash
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          if timeout 8m python scripts/fetch_priority_toc.py --detail-limit 12 --max-items-per-source 40; then
            echo "Priority publisher TOCs completed."
          else
            echo "::warning::Priority publisher TOCs timed out or failed; continuing with Crossref and RSS sources."
          fi
      - name: Discover and fetch RSS feeds
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        run: python scripts/fetch_rss.py --discover
      - name: Fetch ScienceDirect in-press search
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout 10m python scripts/fetch_sciencedirect_search.py --days 4 --timeout 25 --workers 6 --max-items-per-journal 10; then
            echo "ScienceDirect search completed."
          else
            echo "::warning::ScienceDirect search timed out or failed; keeping Crossref/RSS paths."
          fi
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      - name: Fetch Crossref priority metadata
        if: steps.mode.outputs.mode == 'light' && (github.event_name != 'schedule' || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          mkdir -p data/raw/crossref-priority
          TODAY=$(python -c "from scripts.common import today_str; print(today_str())")
          if timeout 8m python scripts/fetch_crossref.py --tier hourly_crossref_priority --days ${{ steps.mode.outputs.days }} --created-days 7 --rows 12 --sleep 0.1 --timeout 20 --retries 2 --output data/raw/crossref-priority/${TODAY}.json; then
            echo "Crossref priority metadata fetch completed."
          else
            echo "::warning::Crossref priority metadata fetch timed out or failed; continuing with the broader fast pass."
          fi
      - name: Fetch Crossref fast metadata
        if: steps.mode.outputs.mode == 'light' && (github.event_name != 'schedule' || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout ${{ steps.mode.outputs.crossref_wall_timeout }} python scripts/fetch_crossref.py --tier "${{ steps.mode.outputs.tier }}" --days ${{ steps.mode.outputs.days }} --rows ${{ steps.mode.outputs.rows }} --sleep 0.1 --timeout ${{ steps.mode.outputs.crossref_request_timeout }} --retries ${{ steps.mode.outputs.crossref_retries }}; then
            echo "Crossref fast metadata fetch completed."
          else
            echo "::warning::Crossref fast metadata fetch timed out or failed; continuing with RSS, publisher pages, Chinese journals, and working paper sources."
          fi
      - name: Fetch Crossref full metadata
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout ${{ steps.mode.outputs.crossref_wall_timeout }} python scripts/fetch_crossref.py --days ${{ steps.mode.outputs.days }} --created-days 7 --rows ${{ steps.mode.outputs.rows }} --sleep 0.1 --timeout ${{ steps.mode.outputs.crossref_request_timeout }} --retries ${{ steps.mode.outputs.crossref_retries }}; then
            echo "Crossref full metadata fetch completed."
          else
            echo "::warning::Crossref full metadata fetch timed out or failed; continuing with the rest of the monitor."
          fi
      - name: Fetch Crossref metadata for one journal
        if: steps.mode.outputs.mode == 'single' && github.event.inputs.journal != '' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout ${{ steps.mode.outputs.crossref_wall_timeout }} python scripts/fetch_crossref.py --only "${{ github.event.inputs.journal }}" --days ${{ steps.mode.outputs.days }} --created-days 7 --rows ${{ steps.mode.outputs.rows }} --sleep 0.1 --timeout ${{ steps.mode.outputs.crossref_request_timeout }} --retries ${{ steps.mode.outputs.crossref_retries }}; then
            echo "Single-journal Crossref fetch completed."
          else
            echo "::warning::Single-journal Crossref fetch timed out or failed; continuing with the rest of the monitor."
          fi
      - name: Fetch independent OpenAlex recall source
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        shell: bash
        run: |
          mkdir -p data/raw/openalex-recall
          TODAY=$(python -c "from scripts.common import today_str; print(today_str())")
          if timeout 6m python scripts/fetch_openalex_recall.py --days 21 --rows 50 --timeout 25 --output data/raw/openalex-recall/${TODAY}.json; then
            echo "OpenAlex recall fetch completed."
          else
            echo "::warning::OpenAlex recall fetch failed; Crossref and publisher sources remain authoritative."
          fi
      - name: Fetch Chinese journal pages
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        shell: bash
        run: |
          DATE="$(TZ=Asia/Shanghai date +%F)"
          mkdir -p data/raw/cn
          for JOURNAL in \
            journal-f69300dae2 \
            journal-679eaa2a0c \
            journal-ba9f46c919 \
            journal-379b4022ce \
            journal-bf2aa9381f \
            journal-edcb877d78
          do
            echo "Fetching Chinese journal: $JOURNAL"
            timeout 75s python scripts/fetch_cn_journals.py \
              --tier "${{ steps.mode.outputs.tier }}" \
              --only "$JOURNAL" \
              --output "data/raw/cn/${DATE}-${JOURNAL}.json" \
              --detail-limit ${{ steps.mode.outputs.cn_detail_limit }} \
              || echo "::warning::Chinese journal fetch timed out or failed: $JOURNAL"
          done
      # CNKI RSS is intentionally absent from the public GitHub runner.
      # GitHub runner IPs are rejected intermittently (HTTP 418), and a failed
      # public attempt must never overwrite the last successful local CNKI
      # supplement status. The Windows local task owns this source and pushes
      # its verified result to main after all configured feeds succeed.
      - name: Fetch working paper sources
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        shell: bash
        run: |
          STAGE="1"
          LIMIT="12"
          PREPRINT_DETAIL_LIMIT="6"
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            STAGE="2"
            LIMIT="30"
            PREPRINT_DETAIL_LIMIT="18"
          fi
          if timeout 15m python scripts/fetch_preprints.py --stage "$STAGE" --limit-per-source "$LIMIT" --detail-limit "$PREPRINT_DETAIL_LIMIT" --timeout 20; then
            echo "Working-paper sources completed."
          else
            echo "::warning::Working-paper sources timed out or failed; preserving previous working-paper data."
          fi
      - name: Backfill missing IZA authors
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: timeout 4m python scripts/backfill_iza_authors.py --days 7 --limit 20 --timeout 10
      - name: Aggregate Chinese journal status
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/aggregate_cn_status.py
      - name: Dedupe new papers
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/dedupe.py
      - name: Repair official-date archives
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/repair_official_date_archives.py
      - name: Clean historical working-paper catalogue items
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/clean_historical_working_papers.py
      - name: Remove non-paper navigation records
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/clean_nonpaper_records.py
      - name: Clean RSS backfill
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/clean_rss_backfill.py
      - name: Clean Chinese journal noise
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/clean_cn_noise.py
      - name: Apply manual overrides
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/apply_overrides.py
      - name: Normalize daily records
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/normalize_records.py
      - name: Remove already-seen RSS backflow
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/remove_seen_backflow.py
      - name: Audit ingestion health
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/audit_ingestion.py
      - name: Audit formal journal coverage
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/audit_formal_journal_coverage.py
      - name: Audit recent 72-hour coverage
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/audit_recent72_coverage.py
      - name: Audit formal source health
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/audit_source_health.py
      - name: Triage degraded sources
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/triage_source_health.py
      - name: Audit external sentinel coverage
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/audit_alohomora_coverage.py
      - name: Build pre-enrichment metadata retry queue
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/build_metadata_retry_queue.py --recent-days 30 --limit 500
      - name: Enrich publisher detail pages
        if: steps.mode.outputs.detail_limit != '0' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        run: python scripts/enrich_metadata.py --latest-days 7 --limit ${{ steps.mode.outputs.detail_limit }} --timeout 12
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      - name: Backfill abstracts and authors from metadata indexes
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout 12m python scripts/enrich_metadata.py --abstract-only --retry-queue data/metadata_retry_queue.json --latest-days 5000 --limit 180 --workers 8 --timeout 12; then
            echo "Abstract and author backfill completed."
          else
            echo "::warning::Abstract and author backfill timed out or failed; preserving existing metadata."
          fi
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
      - name: Re-apply historical working-paper quarantine after date enrichment
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/clean_historical_working_papers.py
      - name: Retry today missing publisher abstracts
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout 8m python scripts/enrich_metadata.py --latest-days 1 --limit 80 --workers 4 --timeout 12; then
            echo "Today abstract retry completed."
          else
            echo "::warning::Today abstract retry timed out or failed; keeping the honest retry status."
          fi
      - name: Recover historical missing authors
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout 8m python scripts/enrich_metadata.py --authors-only --latest-days 5000 --limit 100 --workers 8 --timeout 12; then
            echo "Historical author recovery completed."
          else
            echo "::warning::Historical author recovery timed out or failed; preserving explicit missing-author status."
          fi
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      - name: Recover missing and weak official dates
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout 10m python scripts/enrich_metadata.py --date-only --latest-days 5000 --limit 120 --workers 8 --timeout 12; then
            echo "Official-date recovery completed."
          else
            echo "::warning::Official-date recovery timed out or failed; preserving explicit weak-date status."
          fi
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      - name: Semantic Scholar key keep-alive
        shell: bash
        run: python scripts/semantic_scholar_keepalive.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      - name: Build Semantic Scholar usage report
        run: python scripts/build_semantic_scholar_usage.py
      - name: Batch recover metadata from independent indexes
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        shell: bash
        run: |
          if timeout 20m python scripts/recover_metadata_batch.py --limit "${{ steps.mode.outputs.recovery_limit }}" --recent-days 5000 --workers 8 --timeout 12; then
            echo "Batch metadata recovery completed."
          else
            echo "::warning::Batch metadata recovery timed out or failed; preserving explicit missing status."
          fi
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}

      - name: Repair public data integrity
        if: steps.mode.outputs.mode == 'full' && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        run: python scripts/public_integrity.py
      - name: Normalize enriched metadata
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/normalize_records.py
      - name: Repair enriched official-date archives
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/repair_official_date_archives.py
      - name: Final historical-record quarantine
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/clean_historical_working_papers.py
      - name: Enrich China relevance
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/enrich_china_relevance.py --all
      # Paid AI enrichment is intentionally absent from discovery. Translation
      # and AI China-relevance run in ai-enrichment.yml under call-time cost guards.
      - name: Reconcile durable ingestion retries
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/reconcile_retry_queues.py
      - name: Build upstream missing abstract list
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/build_upstream_missing_abstracts.py
      - name: Audit product quality
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/product_audit.py
      - name: Build metadata retry queue
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/build_metadata_retry_queue.py --recent-days 30 --limit 500
      - name: Audit metadata recovery
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/audit_metadata_recovery.py
      - name: Enforce public release gate
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/release_gate.py
      - name: Open health anomaly issues
        if: always() && (github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run')
        run: python scripts/open_health_issues.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build consolidated monitor health
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/monitor_health.py
      - name: Record workflow context
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/record_run_context.py --mode "${{ steps.mode.outputs.mode }}" --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}" --run-id "${{ github.run_id }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Repair workflow status
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/repair_workflow_status.py
      - name: Send optional email digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *')
        run: python scripts/send_email_digest.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
      - name: Write run summary
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: python scripts/action_summary.py
      - name: Commit generated updates
        id: commit
        if: github.event_name != 'schedule' || contains(env.FULL_SCHEDULES, github.event.schedule) || steps.watchdog.outputs.decision == 'run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "No generated changes to commit."
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git commit -m "Update paper monitor"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying after a short wait."
            sleep $((attempt * 10))
          done
          echo "Failed to push generated updates after retries."
          exit 1

      - name: Trigger display render
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run render-site.yml --repo "${{ github.repository }}" --ref main
