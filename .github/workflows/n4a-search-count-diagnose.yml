name: N4a search count diagnose

on:
  push:
    branches:
      - brain/n4a-search-filter-count-202

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/n4a-search-filter-count-202
      - name: Print exact countFor/apply source context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/templates/daily_vnext.html').read_text(encoding='utf-8')
          for needle in ('countFor', 'const apply', 'updateButtons();'):
              i = text.find(needle)
              print(needle, i)
              print(repr(text[max(0, i-180):i+700] if i >= 0 else 'NOT FOUND'))
          PY
