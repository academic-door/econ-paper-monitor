name: "Elsevier Early Discovery Probe"

on:
  push:
    branches:
      - brain/p1-elsevier-article-metadata-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe native Search v2 wildcard with existing credentials
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = "https://api.elsevier.com/content/search/sciencedirect"
          target = "10.1016/j.jdeveco.2026.103924"
          headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "econ-paper-monitor/1.0 (https://github.com/academic-door/econ-paper-monitor)",
              "X-ELS-APIKey": os.environ["ELSEVIER_API_KEY"],
          }
          token = os.environ.get("ELSEVIER_INST_TOKEN", "")
          if token:
              headers["X-ELS-Insttoken"] = token

          variants = [
              ("qs-star", {"qs": "*"}),
              ("title-star", {"title": "*"}),
              ("qs-a-star", {"qs": "a*"}),
          ]
          any_hit = False
          for label, search_field in variants:
              body = {
                  **search_field,
                  "pub": "Journal of Development Economics",
                  "loadedAfter": "2026-09-06T00:00:00Z",
                  "display": {"offset": 0, "show": 100, "sortBy": "date"},
              }
              req = urllib.request.Request(endpoint, data=json.dumps(body).encode(), headers=headers, method="PUT")
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode())
                      rate = {
                          "limit": response.headers.get("X-RateLimit-Limit"),
                          "remaining": response.headers.get("X-RateLimit-Remaining"),
                      }
              except urllib.error.HTTPError as exc:
                  text = exc.read().decode(errors="replace")[:600]
                  print(f"VARIANT {label} HTTP={exc.code} status={exc.headers.get('X-ELS-Status')} body={text}")
                  continue
              results = payload.get("results") if isinstance(payload, dict) else None
              if not isinstance(results, list):
                  print(f"VARIANT {label} invalid-results message={payload.get('message') if isinstance(payload, dict) else ''}")
                  continue
              hit = False
              print(f"VARIANT {label} results={len(results)} rate={rate}")
              for idx, item in enumerate(results):
                  if not isinstance(item, dict):
                      continue
                  doi = str(item.get("doi") or "").casefold()
                  if target in doi:
                      hit = True
                      any_hit = True
                      print(f"TARGET_HIT variant={label} idx={idx} doi={doi} pii={item.get('pii')} loadDate={item.get('loadDate')} title={str(item.get('title') or '')[:220]}")
              print(f"RESULT variant={label} target_hit={hit}")
          if not any_hit:
              raise SystemExit("No native wildcard variant discovered the target")
          PY
