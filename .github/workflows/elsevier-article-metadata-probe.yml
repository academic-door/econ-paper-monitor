name: "Elsevier Early Discovery Probe"

on:
  push:
    branches:
      - brain/p1-elsevier-article-metadata-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official ScienceDirect RSS
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          feed_url = "https://rss.sciencedirect.com/publication/science/03043878"
          target_doi = "10.1016/j.jdeveco.2026.103924"
          target_title = "political career incentives and the environmental costs"
          request = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "econ-paper-monitor/1.0 (https://github.com/academic-door/econ-paper-monitor)"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = response.read()
              print(f"HTTP status={response.status} content_type={response.headers.get('Content-Type')} bytes={len(payload)} final_url={response.geturl()}")

          root = ET.fromstring(payload)
          items = root.findall(".//item")
          print(f"RSS items={len(items)}")
          hit = False
          for idx, item in enumerate(items):
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              guid = (item.findtext("guid") or "").strip()
              description = (item.findtext("description") or "").strip()
              pubdate = (item.findtext("pubDate") or "").strip()
              haystack = " ".join((title, link, guid, description)).casefold()
              doi_match = re.search(r"10\.1016/j\.jdeveco\.2026\.\d+", haystack, flags=re.I)
              pii_match = re.search(r"S03043878\d+", haystack, flags=re.I)
              if idx < 12:
                  print(f"ITEM idx={idx} pubDate={pubdate} doi={doi_match.group(0) if doi_match else ''} pii={pii_match.group(0) if pii_match else ''} title={title[:180]}")
              if target_doi in haystack or target_title in haystack:
                  hit = True
                  print(f"TARGET_HIT idx={idx} pubDate={pubdate} title={title[:220]} link={link[:260]} guid={guid[:220]}")

          print(f"RESULT target_hit={hit}")
          if not hit:
              raise SystemExit("Target JDE article is not present in official ScienceDirect RSS")
          PY
