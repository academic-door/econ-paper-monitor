name: "Elsevier Article Metadata Probe"

on:
  push:
    branches:
      - brain/p1-elsevier-article-metadata-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe paginated Article Metadata API with existing credentials
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api_key = os.environ.get("ELSEVIER_API_KEY", "")
          inst_token = os.environ.get("ELSEVIER_INST_TOKEN", "")
          if not api_key:
              raise SystemExit("ELSEVIER_API_KEY is not configured")

          headers = {
              "Accept": "application/json",
              "User-Agent": "econ-paper-monitor/1.0 (https://github.com/academic-door/econ-paper-monitor)",
              "X-ELS-APIKey": api_key,
          }
          if inst_token:
              headers["X-ELS-Insttoken"] = inst_token

          base = "https://api.elsevier.com/content/metadata/article"
          query = "srctitle(Journal of Development Economics) AND pub-date AFT 20260906"
          target_doi = "10.1016/j.jdeveco.2026.103924"
          target_hit = False
          seen = 0
          total = None

          for start in (0, 25, 50):
              params = urllib.parse.urlencode({
                  "query": query,
                  "count": "25",
                  "start": str(start),
                  "view": "STANDARD",
              })
              request = urllib.request.Request(f"{base}?{params}", headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                      rate = {
                          "limit": response.headers.get("X-RateLimit-Limit"),
                          "remaining": response.headers.get("X-RateLimit-Remaining"),
                          "reset": response.headers.get("X-RateLimit-Reset"),
                      }
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:500]
                  raise SystemExit(
                      f"page start={start}: HTTP {exc.code} status={exc.headers.get('X-ELS-Status')} body={body}"
                  ) from exc

              search = payload.get("search-results") if isinstance(payload, dict) else None
              if not isinstance(search, dict):
                  raise SystemExit(f"page start={start}: missing search-results")
              entries = search.get("entry") or []
              if not isinstance(entries, list):
                  entries = []
              total = search.get("opensearch:totalResults")
              seen += len(entries)
              print(f"PAGE start={start} total={total} entries={len(entries)} rate={rate}")
              for item in entries:
                  if not isinstance(item, dict):
                      continue
                  doi = str(item.get("prism:doi") or item.get("dc:identifier") or "")
                  if target_doi in doi.casefold():
                      target_hit = True
                      pii = str(item.get("pii") or "")
                      title = str(item.get("dc:title") or "")[:200]
                      cover = str(item.get("prism:coverDate") or "")
                      source = str(item.get("prism:publicationName") or "")
                      print(
                          f"TARGET_HIT start={start} doi={target_doi} pii={pii} cover={cover} source={source} title={title}"
                      )
              if len(entries) < 25:
                  break

          print(f"RESULT seen={seen} total={total} target_hit={target_hit}")
          if not target_hit:
              raise SystemExit("Target JDE DOI not found across recent Article Metadata pages")
          PY
