name: One-shot keyed S2 retry patcher
on:
  push:
    paths:
      - .github/workflows/_s2-keyed-no-retry-patcher.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/p1-s2-backpressure-fast-trip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded keyed retry patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/enrich_metadata.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS = 2\nSS_MAX_RETRY_BACKOFF_SECONDS = 30.0\n',
                  'SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS = 2\n# Under the current keyed shared-bucket pressure, hidden retries amplify 429s\n# before the circuit can protect later DOI calls. Keep unkeyed behavior\n# backward-compatible, but make a keyed 429 terminal for this optional source.\nSS_KEY_MAX_RETRIES = 0\nSS_MAX_RETRY_BACKOFF_SECONDS = 30.0\n',
              ),
              (
                  '            "fast_trip_after_consecutive_rate_limits": SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS,\n            "skip_after": SS_RATE_LIMIT_SKIP_AFTER,\n',
                  '            "fast_trip_after_consecutive_rate_limits": SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS,\n            "keyed_max_retries": SS_KEY_MAX_RETRIES if key_configured else None,\n            "skip_after": SS_RATE_LIMIT_SKIP_AFTER,\n',
              ),
              (
                  '    attempts = max(0, retries) + 1\n    payload: dict[str, Any] = {}\n',
                  '    requested_retries = max(0, retries)\n    effective_retries = min(requested_retries, SS_KEY_MAX_RETRIES) if api_key else requested_retries\n    attempts = effective_retries + 1\n    payload: dict[str, Any] = {}\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch precondition failed: expected one match, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused S2 regression
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_semantic_scholar_throttle.py
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_s2-keyed-no-retry-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/enrich_metadata.py .github/workflows/_s2-keyed-no-retry-patcher.yml
          git commit -m 'fix(s2): stop keyed retries under sustained pressure'
          git push origin HEAD:brain/p1-s2-backpressure-fast-trip
