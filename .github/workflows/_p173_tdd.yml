name: P173 OECD lifecycle TDD

on:
  push:
    branches:
      - brain/p1-5b-oecd-production-reconcile-v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run bounded OECD lifecycle regression
        run: python -m pytest tests/test_oecd_working_paper_backfill.py tests/test_first_seen_cleanup.py -q
