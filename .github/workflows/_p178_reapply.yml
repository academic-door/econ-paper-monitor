name: P178 reapply on current main

on:
  push:
    branches:
      - brain/p1-elsevier-production-revise

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/p1-elsevier-production-revise
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded implementation and regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/fetch_sciencedirect_search.py')
          text = script.read_text(encoding='utf-8')
          replacements = [
              ('ELSEVIER_SEARCH_CLIENT_TARGET_RPS = 1.6', 'ELSEVIER_SEARCH_CLIENT_TARGET_RPS = 0.4'),
              ('''            results = response_payload.get("results")\n            if not isinstance(results, list):\n                message = clean_markdown(response_payload.get("message"))\n                raise ValueError(f"sciencedirect-api-invalid-results{': ' + message if message else ''}")\n            return [item for item in results if isinstance(item, dict)], SCIENCEDIRECT_API_URL\n''', '''            results = response_payload.get("results")\n            if results is None:\n                results_found = response_payload.get("resultsFound")\n                try:\n                    results_found_count = int(results_found)\n                except (TypeError, ValueError):\n                    results_found_count = None\n                message = clean_markdown(response_payload.get("message"))\n                els_status = (_header_value(response.headers, "X-ELS-Status") or "").upper()\n                if results_found_count == 0 and not message and els_status in ("", "OK"):\n                    results = []\n                else:\n                    raise ValueError(f"sciencedirect-api-invalid-results{': ' + message if message else ''}")\n            elif not isinstance(results, list):\n                message = clean_markdown(response_payload.get("message"))\n                raise ValueError(f"sciencedirect-api-invalid-results{': ' + message if message else ''}")\n            return [item for item in results if isinstance(item, dict)], SCIENCEDIRECT_API_URL\n'''),
              ('''                retry_after = _header_value(exc.headers, "Retry-After")\n                try:\n                    delay = max(1.1, min(5.0, float(retry_after))) if retry_after else 1.1\n                except ValueError:\n                    delay = 1.1\n                time.sleep(delay)\n''', '''                retry_after = _header_value(exc.headers, "Retry-After")\n                try:\n                    provider_delay = max(0.0, float(retry_after)) if retry_after else 0.0\n                except ValueError:\n                    provider_delay = 0.0\n                time.sleep(max(ELSEVIER_SEARCH_MIN_INTERVAL_SECONDS, provider_delay))\n'''),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, (old[:60], text.count(old))
              text = text.replace(old, new)
          script.write_text(text, encoding='utf-8')

          tests = Path('tests/test_sciencedirect_search_api.py')
          text = tests.read_text(encoding='utf-8')
          pairs = [
              ('def test_native_payload_and_parent_rate_ceiling(self):', 'def test_native_payload_and_live_proven_rate_gate(self):'),
              ('self.assertLessEqual(sd.ELSEVIER_SEARCH_CLIENT_TARGET_RPS, 1.6)\n        self.assertGreaterEqual(sd.ELSEVIER_SEARCH_MIN_INTERVAL_SECONDS, 0.625)', 'self.assertEqual(sd.ELSEVIER_SEARCH_CLIENT_TARGET_RPS, 0.4)\n        self.assertEqual(sd.ELSEVIER_SEARCH_MIN_INTERVAL_SECONDS, 2.5)'),
              ('self.assertEqual(control["client_target_rps"], 1.6)', 'self.assertEqual(control["client_target_rps"], 0.4)'),
              ('def test_throttle_429_retries_once_and_is_distinct_from_quota(self):', 'def test_throttle_429_retries_once_through_same_rate_gate(self):'),
              ('sleep_mock.assert_called_once()', 'sleep_mock.assert_called_once_with(2.5)'),
              ('self.assertIn("client_target_rps=1.6", message)\n        self.assertIn("min_interval_seconds=0.625", message)', 'self.assertIn("client_target_rps=0.4", message)\n        self.assertIn("min_interval_seconds=2.500", message)'),
          ]
          for old, new in pairs:
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new)

          marker = '''    def test_target_record_keeps_load_date_as_availability_only(self):\n'''
          insert = '''    def test_zero_result_shape_with_omitted_results_is_accepted(self):\n        headers = Message()\n        headers["X-ELS-Status"] = "OK"\n        response = FakeResponse({"details": {}, "resultsFound": 0}, headers)\n        with patch.object(sd.urllib.request, "urlopen", return_value=response), patch.dict(\n            os.environ, {"ELSEVIER_API_KEY": "api-key"}, clear=True\n        ):\n            entries, source_url = sd.fetch_sciencedirect_api(JDE, days=4, timeout=5, max_items=10)\n        self.assertEqual(entries, [])\n        self.assertEqual(source_url, sd.SCIENCEDIRECT_API_URL)\n\n    def test_missing_results_with_nonzero_results_found_remains_an_error(self):\n        headers = Message()\n        headers["X-ELS-Status"] = "OK"\n        response = FakeResponse({"details": {}, "resultsFound": 1}, headers)\n        with patch.object(sd.urllib.request, "urlopen", return_value=response), patch.dict(\n            os.environ, {"ELSEVIER_API_KEY": "api-key"}, clear=True\n        ):\n            with self.assertRaisesRegex(ValueError, "sciencedirect-api-invalid-results"):\n                sd.fetch_sciencedirect_api(JDE, days=4, timeout=5, max_items=10)\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, insert + marker)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Run focused regression tests
        run: python -m unittest tests.test_sciencedirect_search_api -v
      - name: Commit product and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fetch_sciencedirect_search.py tests/test_sciencedirect_search_api.py
          git commit -m 'fix(sciencedirect): respect live rate and zero-result shape'
          git push origin HEAD:brain/p1-elsevier-production-revise
