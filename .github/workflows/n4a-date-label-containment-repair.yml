name: N4a Date Label Containment Repair

on:
  push:
    branches:
      - brain/n4a-date-evidence-label-202

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/n4a-date-evidence-label-202
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore renderer bytes from current main and apply bounded patch
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- scripts/render_site.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/render_site.py')
          data = path.read_bytes()
          replacements = [
              ('<span class="meta-label">官方日期</span>', '<span class="meta-label">日期信息</span>', 2),
              ('<div class="label">官方日期</div>', '<div class="label">日期信息</div>', 1),
          ]
          for old_text, new_text, expected in replacements:
              old = old_text.encode('utf-8')
              new = new_text.encode('utf-8')
              count = data.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} renderer anchors {old_text!r}, found {count}')
              data = data.replace(old, new)
          path.write_bytes(data)
          PY
          git diff --check -- scripts/render_site.py
      - name: Verify focused contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_public_date_evidence_label.py tests/test_public_date_views.py
      - name: Remove repair executor and commit contained change
        run: |
          rm .github/workflows/n4a-date-label-containment-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/render_site.py tests/test_public_date_evidence_label.py .github/workflows/n4a-date-label-containment-repair.yml
          git diff --cached --check
          git status --short
          git commit -m 'N4a contain date-label renderer diff'
          git push origin HEAD:brain/n4a-date-evidence-label-202
