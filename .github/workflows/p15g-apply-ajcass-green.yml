name: P1.5g apply AJCASS GREEN patch

on:
  push:
    branches:
      - brain/p15g-zgncjj-abstract-203
    paths:
      - .github/workflows/p15g-apply-ajcass-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/p15g-zgncjj-abstract-203
      - name: Apply minimal official metadata adapter
        run: python scripts/_p15g_apply_patch.py
      - name: Remove one-shot scaffolding and commit patch
        run: |
          rm .github/workflows/p15g-apply-ajcass-green.yml scripts/_p15g_apply_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/enrich_metadata.py .github/workflows/p15g-apply-ajcass-green.yml scripts/_p15g_apply_patch.py
          git commit -m "Implement official 中国农村经济 abstract recovery"
          git push origin HEAD:brain/p15g-zgncjj-abstract-203
