name: One-shot S2 gate race patcher
on:
  push:
    paths:
      - .github/workflows/_s2-gate-race-patcher.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/p1-s2-backpressure-fast-trip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply race-safe gate patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/enrich_metadata.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS = 2\n# Under the current keyed shared-bucket pressure, hidden retries amplify 429s\n',
                  'SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS = 2\nSS_FAST_TRIP_TERMINAL_RATE_LIMIT_BUDGET = 4\n# Under the current keyed shared-bucket pressure, hidden retries amplify 429s\n',
              ),
              (
                  'SS_MAX_RETRY_BACKOFF_SECONDS = 30.0\n_SS_LOCK = threading.Lock()\n',
                  'SS_MAX_RETRY_BACKOFF_SECONDS = 30.0\n# Start pacing and circuit-state mutation use different locks: the start gate\n# may wait, but provider responses must still be able to update circuit state.\n_SS_GATE_LOCK = threading.Lock()\n_SS_LOCK = threading.Lock()\n',
              ),
              (
                  'def _semantic_scholar_circuit_open_locked() -> bool:\n    if _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS >= SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS:\n        return True\n    if _SS_RATE_LIMITED_COUNT >= SS_RATE_LIMIT_SKIP_AFTER:\n',
                  'def _semantic_scholar_circuit_open_locked() -> bool:\n    if _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS >= SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS:\n        return True\n    if _SS_RATE_LIMITED_COUNT >= SS_FAST_TRIP_TERMINAL_RATE_LIMIT_BUDGET:\n        return True\n    if _SS_RATE_LIMITED_COUNT >= SS_RATE_LIMIT_SKIP_AFTER:\n',
              ),
              (
                  '            "fast_trip_after_consecutive_rate_limits": SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS,\n            "keyed_max_retries": SS_KEY_MAX_RETRIES if key_configured else None,\n',
                  '            "fast_trip_after_consecutive_rate_limits": SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS,\n            "fast_trip_terminal_rate_limit_budget": SS_FAST_TRIP_TERMINAL_RATE_LIMIT_BUDGET,\n            "keyed_max_retries": SS_KEY_MAX_RETRIES if key_configured else None,\n',
              ),
              (
                  '''def _semantic_scholar_gate(*, allow_when_tripped: bool = False) -> bool:\n    """Re-enter pacing before every attempt; only new DOI calls honor an open circuit."""\n    global _SS_LAST_REQUEST\n    with _SS_LOCK:\n        if not allow_when_tripped and _semantic_scholar_circuit_open_locked():\n            return False\n        interval = (\n            SS_KEY_MIN_INTERVAL_SECONDS if _semantic_scholar_api_key() else SS_MIN_INTERVAL_SECONDS\n        )\n        now = time.monotonic()\n        wait = interval - (now - _SS_LAST_REQUEST)\n        if wait > 0:\n            time.sleep(wait)\n        _SS_LAST_REQUEST = time.monotonic()\n    return True\n''',
                  '''def _semantic_scholar_gate(*, allow_when_tripped: bool = False) -> bool:\n    """Serialize starts without blocking provider outcomes from updating circuit state."""\n    global _SS_LAST_REQUEST\n    with _SS_GATE_LOCK:\n        with _SS_LOCK:\n            if not allow_when_tripped and _semantic_scholar_circuit_open_locked():\n                return False\n            interval = (\n                SS_KEY_MIN_INTERVAL_SECONDS if _semantic_scholar_api_key() else SS_MIN_INTERVAL_SECONDS\n            )\n            last_request = _SS_LAST_REQUEST\n        now = time.monotonic()\n        wait = interval - (now - last_request)\n        if wait > 0:\n            time.sleep(wait)\n        # A response from the prior start can arrive while this worker waits.\n        # Recheck after the wait so queued workers cannot outrun the circuit.\n        with _SS_LOCK:\n            if not allow_when_tripped and _semantic_scholar_circuit_open_locked():\n                return False\n            _SS_LAST_REQUEST = time.monotonic()\n    return True\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch precondition failed: expected one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused S2 regression
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_semantic_scholar_throttle.py
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_s2-gate-race-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/enrich_metadata.py .github/workflows/_s2-gate-race-patcher.yml
          git commit -m 'fix(s2): let circuit updates outrun queued starts'
          git push origin HEAD:brain/p1-s2-backpressure-fast-trip
