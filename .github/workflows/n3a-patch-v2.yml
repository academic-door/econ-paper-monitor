name: N3a patch v2

on:
  push:
    branches:
      - brain/n3a-elsevier-batch-201

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/n3a-elsevier-batch-201
      - name: Apply bounded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("data/journals.yml")
          text = registry.read_text(encoding="utf-8")
          if 'title: "Economic Modelling"' not in text:
              rows = [
                  '  - id: "economic-modelling"',
                  '    title: "Economic Modelling"',
                  '    short_name: "EconMod"',
                  '    aliases:',
                  '      - "Economic Modelling"',
                  '    chinese_name: "经济建模"',
                  '    fields:',
                  '      - "applied_empirical"',
                  '    public_group: "金融、发展、实证应用"',
                  '    priority_private: "B"',
                  '    issn: "0264-9993"',
                  '    eissn: "1873-6122"',
                  '    print_issn: "0264-9993"',
                  '    online_issn: "1873-6122"',
                  '    publisher: "Elsevier"',
                  '    sources:',
                  '      - type: rss',
                  '        url: null',
                  '      - type: crossref',
                  '        issn: "0264-9993"',
                  '  - id: "economics-of-education-review"',
                  '    title: "Economics of Education Review"',
                  '    short_name: "EER-Ed"',
                  '    aliases:',
                  '      - "Economics of Education Review"',
                  '    chinese_name: "教育经济学评论"',
                  '    fields:',
                  '      - "applied_empirical"',
                  '    public_group: "金融、发展、实证应用"',
                  '    priority_private: "B"',
                  '    issn: "0272-7757"',
                  '    eissn: null',
                  '    print_issn: null',
                  '    online_issn: null',
                  '    publisher: "Elsevier"',
                  '    sources:',
                  '      - type: rss',
                  '        url: null',
                  '      - type: crossref',
                  '        issn: "0272-7757"',
                  '  - id: "energy-economics"',
                  '    title: "Energy Economics"',
                  '    short_name: "EnEcon"',
                  '    aliases:',
                  '      - "Energy Economics"',
                  '    chinese_name: "能源经济学"',
                  '    fields:',
                  '      - "environmental"',
                  '    public_group: "城市、宏观、人口、劳动、计量、环境、实验"',
                  '    priority_private: "B"',
                  '    issn: "0140-9883"',
                  '    eissn: null',
                  '    print_issn: null',
                  '    online_issn: null',
                  '    publisher: "Elsevier"',
                  '    sources:',
                  '      - type: rss',
                  '        url: null',
                  '      - type: crossref',
                  '        issn: "0140-9883"',
              ]
              registry.write_text(text.rstrip() + "\n" + "\n".join(rows) + "\n", encoding="utf-8")

          public_list = Path("docs/journal-monitor-list.md")
          docs = public_list.read_text(encoding="utf-8")
          if "| Economic Modelling " not in docs:
              marker = "| 其他实证、应用 | Applied Economics                            | AE       | 应用经济学         | B      |\n"
              assert marker in docs
              insert = (
                  "| 其他实证、应用 | Economic Modelling                          | EconMod  | 经济建模           | B      |\n"
                  "| 其他实证、应用 | Economics of Education Review               | EER-Ed   | 教育经济学评论     | B      |\n"
              )
              docs = docs.replace(marker, marker + insert, 1)
              marker = "| 环境经济学顶刊 | Journal of Environmental Economics and Management | JEEM        | 环境经济学与管理杂志 | A      |\n"
              assert marker in docs
              docs = docs.replace(marker, marker + "| 其他环境经济学 | Energy Economics                                | EnEcon      | 能源经济学           | B      |\n", 1)
              public_list.write_text(docs, encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journals.yml docs/journal-monitor-list.md
          git diff --cached --check
          git commit -m "Admit bounded N3a Elsevier journal batch"
          git push origin HEAD:brain/n3a-elsevier-batch-201
