name: Monitor Watchdog

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Attribution only; never selects a workflow or recovery action"
        required: false
        type: choice
        default: manual
        options:
          - manual
          - cloudflare-cron
      scheduled_at:
        description: "UTC Cloudflare Cron tick for audit correlation only"
        type: string
        required: false
  schedule:
    # Stagger off common :00/:15/:30/:45 queue peaks; cadence remains 15 minutes.
    - cron: "11,26,41,56 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: paper-monitor-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Record trigger attribution
        shell: bash
        env:
          TRIGGER_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_INPUT: ${{ inputs.trigger_source }}
          EXTERNAL_SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          if [ "$TRIGGER_EVENT_NAME" = "schedule" ]; then
            TRIGGER_SOURCE="github_schedule"
          elif [ "$TRIGGER_INPUT" = "cloudflare-cron" ]; then
            TRIGGER_SOURCE="cloudflare_cron_claimed"
          else
            TRIGGER_SOURCE="manual"
          fi
          # workflow_dispatch attribution remains a claim until a real Cloudflare
          # scheduled invocation is independently correlated to this run ID.
          if [[ "$EXTERNAL_SCHEDULED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$ ]]; then
            SCHEDULED_AT="$EXTERNAL_SCHEDULED_AT"
          else
            SCHEDULED_AT="not-provided"
          fi
          echo "WATCHDOG_TRIGGER_SOURCE=$TRIGGER_SOURCE"
          echo "WATCHDOG_EXTERNAL_SCHEDULED_AT=$SCHEDULED_AT"
          echo "WATCHDOG_RUN_ID=$GITHUB_RUN_ID"
          echo "WATCHDOG_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "WATCHDOG_WORKFLOW=watchdog.yml"
          {
            echo "Trigger: $TRIGGER_SOURCE"
            echo "External scheduled tick: $SCHEDULED_AT"
            echo "GitHub run: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check monitor freshness
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Full windows retain their 15m grace. Completion-age recovery alone
          # can exceed the unchanged 90m *creation* SLA after a long full run.
          # An early 70m creation fence leaves margin for 15m Cron ticks.
          # The existing active-run gate still prevents overlapping Update work.
          LAST_CREATED=""
          if LAST_CREATED="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow update.yml \
            --limit 40 \
            --json createdAt \
            --jq '[.[].createdAt] | sort | last // ""' 2>/tmp/update-run-list.err)"; then
            echo "Latest Update creation: ${LAST_CREATED:-none}"
          else
            echo "::warning::Update run creation lookup unavailable; falling back to persisted completion history."
            cat /tmp/update-run-list.err || true
            LAST_CREATED=""
          fi
          DECISION="$(python scripts/should_dispatch_monitor.py \
            --light-min-minutes 60 \
            --latest-created-at "$LAST_CREATED" \
            --creation-min-minutes 70 \
            --full-times 00:00,06:00,12:00,18:00 \
            --full-grace-minutes 15)"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Monitor freshness: $DECISION"
      - name: Check local CNKI freshness
        run: python scripts/audit_local_cnki_status.py --max-age-hours 30
      - name: Check Fast discovery freshness
        id: fast
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Internal creation=25m and success=40m thresholds live in the
          # tested owner helper; public Fast creation SLA remains 45m.
          if ! RUNS="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow fast-discovery.yml \
            --limit 30 \
            --json createdAt,updatedAt,status,conclusion 2>/tmp/fast-run-list.err)"; then
            echo "::warning::Unable to query Fast Discovery history; skipping Fast fallback this watchdog run."
            cat /tmp/fast-run-list.err || true
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "active=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Creation and successful completion are separate clocks.
          # A slow run's recent success cannot conceal >45m since creation.
          if ! DECISION="$(printf '%s' "$RUNS" | python scripts/assess_fast_recovery.py)"; then
            echo "::warning::Fast freshness assessment failed; skipping unsafe fallback."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "active=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$DECISION" >> "$GITHUB_OUTPUT"
      - name: Dispatch fast discovery fallback
        if: steps.fast.outputs.stale == 'true' && steps.fast.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fast-discovery.yml \
            --repo "${{ github.repository }}" \
            --ref main
      - name: Skip active Fast discovery
        if: steps.fast.outputs.stale == 'true' && steps.fast.outputs.active != '0'
        run: echo "A Fast Discovery run is already active or run history is uncertain; Fast fallback skipped."
      - name: Check active monitor run
        id: active
        if: steps.freshness.outputs.decision == 'light' || steps.freshness.outputs.decision == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          IN_PROGRESS="$(gh run list --repo "${{ github.repository }}" --workflow update.yml --status in_progress --json databaseId --jq 'length')"
          QUEUED="$(gh run list --repo "${{ github.repository }}" --workflow update.yml --status queued --json databaseId --jq 'length')"
          WAITING="$(gh run list --repo "${{ github.repository }}" --workflow update.yml --status waiting --json databaseId --jq 'length')"
          ACTIVE=$((IN_PROGRESS + QUEUED + WAITING))
          echo "count=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "Active Update Paper Monitor runs: $ACTIVE"
      - name: Dispatch core monitor fallback
        if: steps.freshness.outputs.decision == 'light' && steps.active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update.yml \
            --repo "${{ github.repository }}" \
            -f mode=light \
            -f days=14
      - name: Dispatch full monitor fallback
        if: steps.freshness.outputs.decision == 'full' && steps.active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update.yml \
            --repo "${{ github.repository }}" \
            -f mode=full \
            -f days=45
      - name: Skip active monitor
        if: (steps.freshness.outputs.decision == 'light' || steps.freshness.outputs.decision == 'full') && steps.active.outputs.count != '0'
        run: echo "An update workflow is already active; watchdog fallback skipped."
      - name: Skip fresh monitor
        if: startsWith(steps.freshness.outputs.decision, 'skip:')
        run: echo "Recent core monitor exists; watchdog fallback skipped."
