name: Apply JARE retry patch

on:
  push:
    branches:
      - patch/jare-retry-170

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/jare-retry-170
      - name: Apply bounded retry patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/fetch_priority_toc.py')
          text = path.read_text(encoding='utf-8')

          jare_start = text.index('    "journal-of-agricultural-and-resource-economics": [{')
          jare_end = text.index('    "journal-of-human-resources": [', jare_start)
          jare_block = text[jare_start:jare_end]
          old_line = '        "fallback_issn": "1068-5502",\n'
          if jare_block.count(old_line) != 1:
              raise SystemExit(f'JARE fallback line count={jare_block.count(old_line)}')
          jare_block = jare_block.replace(old_line, '        "publisher_attempts": 3,\n', 1)
          text = text[:jare_start] + jare_block + text[jare_end:]

          func_start = text.index('def fetch_target_with_fallback(')
          body_start = text.index('    label = f"{journal.get(\'id\')}/{target[\'kind\']}"', func_start)
          func_end = text.index('\n\ndef main() -> None:', body_start)
          new_body = '''    label = f"{journal.get('id')}/{target['kind']}"
    publisher_attempts = max(1, int(target.get("publisher_attempts") or 1))
    last_error: Exception | None = None
    for attempt in range(publisher_attempts):
        try:
            fetched = fetch_target(
                journal,
                target,
                timeout=timeout,
                detail_limit=detail_limit,
                max_items=max_items,
            )
            if fetched:
                return fetched, 0, True, [f"{label}: {len(fetched)}"], False
            fallback = fetch_crossref_fallback(
                journal, target, timeout=timeout, max_items=max_items
            )
            return (
                fallback,
                len(fallback),
                False,
                [f"{label}: 0", f"{label}: crossref fallback {len(fallback)}"],
                not fallback,
            )
        except Exception as exc:  # noqa: BLE001 - bounded source retry before fallback.
            last_error = exc
            if attempt + 1 < publisher_attempts:
                time.sleep(2.0)
                continue
            break
    exc = last_error or RuntimeError("publisher fetch failed without an exception")
    try:
        fallback = fetch_crossref_fallback(
            journal, target, timeout=timeout, max_items=max_items
        )
        fallback_message = f"{label}: {type(exc).__name__}; crossref fallback {len(fallback)}"
        return fallback, len(fallback), False, [fallback_message], not fallback
    except Exception as fallback_exc:  # noqa: BLE001 - preserve both errors.
        return (
            [],
            0,
            False,
            [
                f"{label}: {type(exc).__name__}; crossref fallback "
                f"{type(fallback_exc).__name__}: {fallback_exc}"
            ],
            True,
        )
'''
          text = text[:body_start] + new_body + text[func_end:]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/fetch_priority_toc.py
          rm .github/workflows/apply-jare-retry-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fetch_priority_toc.py .github/workflows/apply-jare-retry-temp.yml
          git commit -m "fix(data): retry transient JARE publisher failures"
          git push origin HEAD:patch/jare-retry-170
