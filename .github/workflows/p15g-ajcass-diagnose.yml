name: P1.5g AJCASS transport diagnostic

on:
  push:
    branches:
      - brain/p15g-ajcass-diagnose-203

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare concurrent and serial official API probes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          IDS = [123527, 123528, 123529, 123531, 123532, 123533, 123534, 123535]
          URL = "https://api.ajcass.com/api/SiteWebApi/GetContentInfo"

          def probe(content_id):
              payload = {
                  "channelId": 0,
                  "contentId": content_id,
                  "dataShowType": 1,
                  "dataSourceType": 3,
                  "issue": 0,
                  "year": 0,
                  "JournalID": 201606270007,
              }
              req = urllib.request.Request(
                  URL,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={
                      "User-Agent": "econ-paper-monitor/1.0 (https://github.com/academic-door/econ-paper-monitor)",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      raw = resp.read()
                      data = json.loads(raw.decode(resp.headers.get_content_charset() or "utf-8"))
                  inner = data.get("data") if isinstance(data, dict) else None
                  info = inner.get("issueContentInfoResult") if isinstance(inner, dict) else None
                  return {
                      "id": content_id,
                      "http": resp.status,
                      "info": isinstance(info, dict),
                      "title_len": len(str(info.get("title") or "")) if isinstance(info, dict) else 0,
                      "abstract_len": len(str(info.get("abstract") or "")) if isinstance(info, dict) else 0,
                  }
              except urllib.error.HTTPError as exc:
                  return {"id": content_id, "error": f"HTTP {exc.code} {exc.reason}"}
              except Exception as exc:
                  return {"id": content_id, "error": f"{type(exc).__name__}: {exc!r}"}

          print("=== concurrent workers=8 ===")
          with ThreadPoolExecutor(max_workers=8) as executor:
              concurrent = list(executor.map(probe, IDS))
          for result in concurrent:
              print(json.dumps(result, ensure_ascii=False, sort_keys=True))

          print("=== serial ===")
          serial = []
          for content_id in IDS:
              serial.append(probe(content_id))
              time.sleep(0.35)
          for result in serial:
              print(json.dumps(result, ensure_ascii=False, sort_keys=True))

          concurrent_ok = sum(1 for item in concurrent if item.get("abstract_len", 0) >= 40)
          serial_ok = sum(1 for item in serial if item.get("abstract_len", 0) >= 40)
          print(f"summary concurrent_ok={concurrent_ok}/8 serial_ok={serial_ok}/8")
          PY
