name: AI Enrichment

on:
  workflow_dispatch:
  schedule:
    # Start just after full-monitor/off-peak boundaries. GitHub can delay cron
    # dispatch substantially, so avoid slots immediately before DeepSeek peak
    # windows. Beijing: 12:05, 18:05, 00:05, 06:05.
    - cron: "5 4,10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: paper-monitor-main-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh deterministic China relevance candidates
        run: python scripts/enrich_china_relevance.py --all
      - name: Resolve China relevance candidates with paid AI
        run: python scripts/ai_china_relevance.py --all --latest-days 14 --limit 80 --timeout 25
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DEEPSEEK_MODEL: deepseek-v4-flash
      - name: Translate recent paper metadata
        id: translate
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"
          python scripts/translate.py --limit 240 --abstract-limit 24 --max-seconds 300 --timeout 25 --sleep 0.05 | tee "$LOG_FILE"
          LINE="$(grep '^translation ' "$LOG_FILE" | tail -1 || true)"
          STATE="completed"
          if echo "$LINE" | grep -Eq 'state=peak_deferred'; then
            STATE="peak_deferred"
            echo "::notice title=Translation deferred by cost guard::$LINE"
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          {
            echo "### Translation enrichment"
            echo
            echo "- state: `$STATE`"
            echo "- result: `$LINE`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DEEPSEEK_MODEL: deepseek-v4-flash
      - name: Normalize AI-enriched records
        run: python scripts/normalize_records.py
      - name: Repair public data integrity
        run: python scripts/public_integrity.py
      - name: Enforce release gate
        run: python scripts/release_gate.py
      - name: Commit only durable AI enrichment changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/seen.json data/daily data/translation_cache.json data/china_relevance_cache.json data/ai_cost_usage.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "No durable AI enrichment change; transient status timestamps are not committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/daily data/translation_cache.json data/china_relevance_cache.json data/ai_cost_usage.json
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git commit -m "AI enrichment update"
          if ! git diff --quiet; then
            echo "Discarding non-published tracked changes before rebase:"
            git status --short
            git restore --worktree .
          fi
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying after a short wait."
            sleep $((attempt * 8))
          done
          echo "Failed to publish AI enrichment after retries."
          exit 1
      - name: Render published site inline
        if: steps.commit.outputs.changed == 'true'
        run: bash scripts/render_published_site.sh
