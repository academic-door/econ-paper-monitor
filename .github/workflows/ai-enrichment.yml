name: AI Enrichment

on:
  workflow_dispatch:
  schedule:
    # Cost-safe slots with delay margin before the next DeepSeek weekday peak.
    # Beijing: 00:15, 06:15, 18:15. The call-time guard remains authoritative
    # if GitHub delays a run into a peak window.
    - cron: "15 10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: paper-monitor-main-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh deterministic China relevance candidates
        run: python scripts/enrich_china_relevance.py --all
      - name: Resolve China relevance candidates with paid AI
        run: python scripts/ai_china_relevance.py --all --latest-days 14 --limit 80 --timeout 25
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DEEPSEEK_MODEL: deepseek-v4-flash
      - name: Translate recent paper metadata
        run: python scripts/translate.py --limit 240 --abstract-limit 24 --max-seconds 300 --timeout 25 --sleep 0.05
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DEEPSEEK_MODEL: deepseek-v4-flash
      - name: Report translation outcome
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/status.json")
          status = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          entry = (status.get("sources") or {}).get("translation") or {}
          outcome = entry.get("outcome") or "unknown"
          message = entry.get("message") or ""
          print(f"translation outcome: {outcome}; {message}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("### Translation outcome\n\n")
                  handle.write(f"- outcome: {outcome}\n")
                  handle.write(f"- {message}\n")
          if outcome == "peak_deferred":
              print("::notice::Translation was deferred by the DeepSeek peak-price guard; no peak-window paid call was made.")
          PY
      - name: Normalize AI-enriched records
        run: python scripts/normalize_records.py
      - name: Repair public data integrity
        run: python scripts/public_integrity.py
      - name: Enforce release gate
        run: python scripts/release_gate.py
      - name: Commit only durable AI enrichment changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/seen.json data/daily data/translation_cache.json data/china_relevance_cache.json data/ai_cost_usage.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "No durable AI enrichment change; transient status timestamps are not committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/daily data/translation_cache.json data/china_relevance_cache.json data/ai_cost_usage.json
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git commit -m "AI enrichment update"
          if ! git diff --quiet; then
            echo "Discarding non-published tracked changes before rebase:"
            git status --short
            git restore --worktree .
          fi
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying after a short wait."
            sleep $((attempt * 8))
          done
          echo "Failed to publish AI enrichment after retries."
          exit 1
      - name: Render published site inline
        if: steps.commit.outputs.changed == 'true'
        run: bash scripts/render_published_site.sh
