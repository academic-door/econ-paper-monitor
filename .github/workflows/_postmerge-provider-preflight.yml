name: S2 live-rate calibration
on:
  push:
    paths:
      - .github/workflows/_postmerge-provider-preflight.yml
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    env:
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Bounded legitimate recovery calibration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import enrich_metadata as em
          import recover_metadata_batch as rmb

          _, records_by_doi, _ = rmb.load_daily_candidates(
              Path('data/daily'), limit=14, recent_days=30
          )
          dois = list(records_by_doi)[:14]
          assert len(dois) >= 10, len(dois)

          def phase(label, interval, subset):
              em.reset_semantic_scholar_throttle()
              em.SS_KEY_MIN_INTERVAL_SECONDS = interval
              em.SS_RATE_LIMIT_SKIP_AFTER = 999
              em.SS_PRESSURE_MIN_SAMPLES = 999
              counts = {}
              for doi in subset:
                  result = em.semantic_scholar_doi_metadata(doi, timeout=15, retries=0)
                  status = str(result.get('_status') or ('available' if result else 'empty'))
                  counts[status] = counts.get(status, 0) + 1
              state = em.semantic_scholar_throttle_state()
              safe = {
                  'label': label,
                  'interval_seconds': interval,
                  'client_rps': round(1.0 / interval, 4),
                  'requests': len(subset),
                  'statuses': counts,
                  'recent_rate_limited': state.get('recent_rate_limited'),
                  'recent_rate_limited_ratio': state.get('recent_rate_limited_ratio'),
              }
              print('S2_CALIBRATION ' + json.dumps(safe, sort_keys=True))
              return safe

          # Cool down before measuring rather than immediately sampling a prior burst.
          time.sleep(15)
          first = phase('0.4rps', 2.5, dois[:6])
          if int(first['recent_rate_limited'] or 0) > 1:
              time.sleep(20)
              phase('0.2rps', 5.0, dois[6:12])
          PY