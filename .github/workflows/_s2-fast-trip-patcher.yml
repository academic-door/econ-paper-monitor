name: One-shot S2 fast-trip patcher
on:
  push:
    paths:
      - .github/workflows/_s2-fast-trip-patcher.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/p1-s2-backpressure-fast-trip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/enrich_metadata.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'SS_PROVIDER_KEY_LIMIT_RPS = 1.0\nSS_CLIENT_TARGET_RPS = 0.8\n# Parent Decision 0015 caps automated keyed clients at <=80% of the\n# provider-published 1 RPS introductory limit.\nSS_KEY_MIN_INTERVAL_SECONDS = 1.0 / SS_CLIENT_TARGET_RPS\n',
                  'SS_PROVIDER_KEY_LIMIT_RPS = 1.0\n# Live calibration on 2026-09-10 remained heavily rate-limited at both\n# 0.4 RPS and 0.2 RPS.  Under active shared-key pressure, 0.2 RPS is a\n# conservative probe rate rather than a claim that this rate is currently\n# sustainable; the fast circuit below stops optional S2 work quickly when\n# the shared bucket remains backpressured.\nSS_CLIENT_TARGET_RPS = 0.2\nSS_KEY_MIN_INTERVAL_SECONDS = 1.0 / SS_CLIENT_TARGET_RPS\n',
              ),
              (
                  'SS_RATE_LIMIT_OPEN_RATIO = 0.30\nSS_MAX_RETRY_BACKOFF_SECONDS = 30.0\n_SS_LOCK = threading.Lock()\n',
                  'SS_RATE_LIMIT_OPEN_RATIO = 0.30\nSS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS = 2\nSS_MAX_RETRY_BACKOFF_SECONDS = 30.0\n_SS_LOCK = threading.Lock()\n',
              ),
              (
                  '_SS_RATE_LIMITED_COUNT = 0\n_SS_RECENT_OUTCOMES: deque[str] = deque(maxlen=SS_RATE_LIMIT_WINDOW)\n',
                  '_SS_RATE_LIMITED_COUNT = 0\n_SS_CONSECUTIVE_TERMINAL_RATE_LIMITS = 0\n_SS_RECENT_OUTCOMES: deque[str] = deque(maxlen=SS_RATE_LIMIT_WINDOW)\n',
              ),
              (
                  '    global _SS_LAST_REQUEST, _SS_RATE_LIMITED_COUNT, _SS_LAST_RETRY_AFTER_SECONDS\n    with _SS_LOCK:\n        _SS_LAST_REQUEST = 0.0\n        _SS_RATE_LIMITED_COUNT = 0\n        _SS_RECENT_OUTCOMES.clear()\n',
                  '    global _SS_LAST_REQUEST, _SS_RATE_LIMITED_COUNT, _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS, _SS_LAST_RETRY_AFTER_SECONDS\n    with _SS_LOCK:\n        _SS_LAST_REQUEST = 0.0\n        _SS_RATE_LIMITED_COUNT = 0\n        _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS = 0\n        _SS_RECENT_OUTCOMES.clear()\n',
              ),
              (
                  'def _semantic_scholar_circuit_open_locked() -> bool:\n    if _SS_RATE_LIMITED_COUNT >= SS_RATE_LIMIT_SKIP_AFTER:\n',
                  'def _semantic_scholar_circuit_open_locked() -> bool:\n    if _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS >= SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS:\n        return True\n    if _SS_RATE_LIMITED_COUNT >= SS_RATE_LIMIT_SKIP_AFTER:\n',
              ),
              (
                  '            "rate_limited_count": _SS_RATE_LIMITED_COUNT,\n            "skip_after": SS_RATE_LIMIT_SKIP_AFTER,\n',
                  '            "rate_limited_count": _SS_RATE_LIMITED_COUNT,\n            "consecutive_terminal_rate_limited": _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS,\n            "fast_trip_after_consecutive_rate_limits": SS_FAST_TRIP_CONSECUTIVE_RATE_LIMITS,\n            "skip_after": SS_RATE_LIMIT_SKIP_AFTER,\n',
              ),
              (
                  '    global _SS_RATE_LIMITED_COUNT, _SS_LAST_RETRY_AFTER_SECONDS\n    with _SS_LOCK:\n        _SS_RECENT_OUTCOMES.append(outcome)\n        if outcome == "rate_limited" and terminal_rate_limit:\n            _SS_RATE_LIMITED_COUNT += 1\n        if retry_after > 0:\n',
                  '    global _SS_RATE_LIMITED_COUNT, _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS, _SS_LAST_RETRY_AFTER_SECONDS\n    with _SS_LOCK:\n        _SS_RECENT_OUTCOMES.append(outcome)\n        if outcome == "rate_limited":\n            if terminal_rate_limit:\n                _SS_RATE_LIMITED_COUNT += 1\n                _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS += 1\n        else:\n            # Reset only the fast terminal-429 streak. Rolling pressure and\n            # the absolute exhausted-DOI counter remain auditable.\n            _SS_CONSECUTIVE_TERMINAL_RATE_LIMITS = 0\n        if retry_after > 0:\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch precondition failed: expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused S2 regression
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_semantic_scholar_throttle.py
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_s2-fast-trip-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/enrich_metadata.py .github/workflows/_s2-fast-trip-patcher.yml
          git commit -m 'fix(s2): fast-trip sustained shared-key backpressure'
          git push origin HEAD:brain/p1-s2-backpressure-fast-trip
