name: P1.5 OECD durable identity readback

on:
  push:
    branches:
      - brain/p1-5c-tandf-production-revise

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve OECD targets across current and historical payloads
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 1cffab1dac4420d8eff63ce4e7d84a25a17f6539
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          old='1cffab1dac4420d8eff63ce4e7d84a25a17f6539'
          needles=('mapping drought severity','effects of structural reforms','everyday spending')

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          def is_target(r):
              title=' '.join(str(r.get('title') or '').split()).casefold()
              return any(n in title for n in needles)

          def compact(r,path):
              return {
                  'path':path,'id':r.get('id'),'identity':r.get('identity'),'title':r.get('title'),
                  'url':r.get('url'),'first_seen':r.get('first_seen'),'source':r.get('source'),
                  'source_id':r.get('source_id'),'source_type':r.get('source_type'),
                  'authors':r.get('authors'),'abstract_len':len(str(r.get('abstract') or '')),
                  'abstract_source':r.get('abstract_source'),'abstract_completeness':r.get('abstract_completeness'),
                  'official_date':r.get('official_date'),'available_online':r.get('available_online'),
                  'published_online':r.get('published_online'),'issue_date':r.get('issue_date'),
                  'date_source':r.get('date_source'),'date_confidence':r.get('date_confidence'),
                  'pending_reason':r.get('pending_reason'),'reasons':r.get('reasons'),
                  'recency_basis':r.get('recency_basis'),'historical_backfill':r.get('historical_backfill'),
              }

          current=[]
          for p in Path('data').rglob('*.json'):
              try: payload=json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception: continue
              seen=set()
              for r in walk(payload):
                  if not is_target(r): continue
                  marker=(str(r.get('title')),str(r.get('url')),str(r.get('first_seen')))
                  if marker in seen: continue
                  seen.add(marker)
                  current.append(compact(r,str(p)))

          historical=[]
          for path in ('data/metadata_retry_queue.json','data/pending_date_records.json'):
              shown=subprocess.run(['git','show',f'{old}:{path}'],text=True,capture_output=True)
              if shown.returncode: continue
              try: payload=json.loads(shown.stdout.lstrip('\ufeff'))
              except Exception: continue
              for r in walk(payload):
                  if is_target(r): historical.append(compact(r,path))

          print('OECD_CURRENT_TARGETS',json.dumps(current,ensure_ascii=False))
          print('OECD_HISTORICAL_TARGETS',json.dumps(historical,ensure_ascii=False))
          PY
