name: N4a patch

on:
  push:
    branches:
      - brain/n4a-public-footer-202

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/n4a-public-footer-202
      - name: Replace migration-era footer links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/render_site.py")
          source = path.read_text(encoding="utf-8")
          old = '<nav class="footer-links" aria-label="页脚导航"><a href="{BASE}/classic/">旧版</a><a href="{BASE}/daily-vnext/">Daily vNext</a><a href="{BASE}/feed.xml">RSS</a></nav>'
          new = '<nav class="footer-links" aria-label="页脚导航"><a href="{BASE}/feed.xml">订阅 RSS</a></nav>'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one secondary footer match, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render_site.py
          git diff --cached --check
          git commit -m "Remove migration-era secondary footer links"
          git push origin HEAD:brain/n4a-public-footer-202
