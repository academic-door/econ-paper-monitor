name: N4a secondary nav containment

on:
  push:
    branches:
      - brain/n4a-secondary-nav-label-202
    paths:
      - .github/workflows/n4a-secondary-nav-contain.yml

permissions:
  contents: write

jobs:
  contain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/n4a-secondary-nav-label-202
          fetch-depth: 0
      - name: Restore owning file bytes and apply one-line fix
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:scripts/render_site.py > /tmp/render_site.py
          mv /tmp/render_site.py scripts/render_site.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/render_site.py')
          data = path.read_bytes()
          target_lf = b"    menu.setAttribute('aria-expanded', String(open));\n"
          target_crlf = b"    menu.setAttribute('aria-expanded', String(open));\r\n"
          if data.count(target_crlf) == 1:
              old = target_crlf
              new = old + b"    menu.setAttribute('aria-label', open ? '\xe5\x85\xb3\xe9\x97\xad\xe5\xaf\xbc\xe8\x88\xaa' : '\xe6\x89\x93\xe5\xbc\x80\xe5\xaf\xbc\xe8\x88\xaa');\r\n"
          elif data.count(target_lf) == 1:
              old = target_lf
              new = old + b"    menu.setAttribute('aria-label', open ? '\xe5\x85\xb3\xe9\x97\xad\xe5\xaf\xbc\xe8\x88\xaa' : '\xe6\x89\x93\xe5\xbc\x80\xe5\xaf\xbc\xe8\x88\xaa');\n"
          else:
              raise SystemExit(f'expected exactly one target; lf={data.count(target_lf)} crlf={data.count(target_crlf)}')
          path.write_bytes(data.replace(old, new, 1))
          PY
          rm .github/workflows/n4a-secondary-nav-contain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render_site.py .github/workflows/n4a-secondary-nav-contain.yml
          git commit -m "N4a contain secondary nav diff"
          git push origin HEAD:brain/n4a-secondary-nav-label-202
