name: Probe JARE Advance from CI

on:
  push:
    branches:
      - probe/jare-advance-ci

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect JARE advance HTML
        shell: bash
        run: |
          python - <<'PY'
          import re
          import sys
          sys.path.insert(0, 'scripts')
          from common import fetch_text

          url = 'https://jareonline.org/preprint-online/'
          text = fetch_text(url, timeout=30)
          agecon_links = len(re.findall(r'ageconsearch\.umn\.edu', text, flags=re.I))
          print(f'length={len(text)} agecon_links={agecon_links}')
          print('has_heading=', 'Published Online' in text)
          for needle in ['Willingness to Pay for Water Quality Improvements', 'ageconsearch.umn.edu']:
              pos = text.find(needle)
              print(f'needle={needle!r} pos={pos}')
              if pos >= 0:
                  print(text[max(0, pos-1200):pos+1800])
          PY
