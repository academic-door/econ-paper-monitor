name: Springer Probe 195

on:
  push:
    branches:
      - brain/p15d-springer-195

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe current Springer targets
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import sys
          sys.path.insert(0, "scripts")
          from enrich_metadata import candidate_urls, enrich_abstract_record, extract_page_metadata, fetch_text_and_url, publisher_proxy_metadata

          targets = [
              ("Environmental and Resource Economics", "10.1007/s10640-026-01117-x"),
              ("Public Choice", "10.1007/s11127-026-01443-0"),
              ("Journal of Population Economics", "10.1007/s00148-026-01203-w"),
          ]
          for journal, doi in targets:
              record = {"journal": journal, "doi": doi, "url": f"https://doi.org/{doi}", "source_type": "journal", "authors": ["probe"]}
              springer = f"https://link.springer.com/article/{doi}"
              print(f"TARGET {doi}")
              print("candidate_urls", candidate_urls(record))
              try:
                  page, final = fetch_text_and_url(springer, 12)
                  parsed = extract_page_metadata(page)
                  print("direct", "ok", len(page), final, len(parsed.get("abstract", "")), parsed.get("abstract_source"))
              except Exception as exc:
                  print("direct", type(exc).__name__, str(exc)[:180])
              proxy = publisher_proxy_metadata(springer, 12)
              print("proxy", proxy.get("_status", "ok"), proxy.get("_status_code"), len(proxy.get("abstract", "")), proxy.get("abstract_source"))
              enriched = copy.deepcopy(record)
              changed, status = enrich_abstract_record(enriched, 12)
              print("enrich", changed, status, len(enriched.get("abstract", "")), enriched.get("abstract_source"))
          PY
