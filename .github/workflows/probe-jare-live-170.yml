name: Probe JARE live source PR170

on:
  push:
    branches:
      - probe/jare-live-170

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe JARE official and Crossref paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          headers = {"User-Agent": "AcademicDoorPaperMonitor/1.0 (mailto:academic-door@users.noreply.github.com)"}
          for issn in ("1068-5502", "2327-8285"):
              url = f"https://api.crossref.org/journals/{issn}/works?rows=2"
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.loads(r.read().decode('utf-8'))
                  items = payload.get('message', {}).get('items') or []
                  print(f'CROSSREF {issn} status=200 items={len(items)}')
                  for item in items[:2]:
                      print(json.dumps({'DOI': item.get('DOI'), 'title': (item.get('title') or [''])[0]}, ensure_ascii=False))
              except urllib.error.HTTPError as exc:
                  print(f'CROSSREF {issn} status={exc.code}')
              except Exception as exc:
                  print(f'CROSSREF {issn} error={type(exc).__name__}:{exc}')

          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import fetch_priority_toc
          from common import load_journals

          journals = {j['id']: j for j in load_journals(Path('data/journals.yml'))}
          journal = journals['journal-of-agricultural-and-resource-economics']
          target = fetch_priority_toc.TARGETS[journal['id']][0]
          try:
              records = fetch_priority_toc.fetch_target(journal, target, timeout=30, detail_limit=0, max_items=50)
              print(f'OFFICIAL publisher_records={len(records)}')
              if records:
                  first = records[0]
                  print(json.dumps({k: first.get(k) for k in ('title','authors','published_online','url','source_url')}, ensure_ascii=False))
          except Exception as exc:
              print(f'OFFICIAL error={type(exc).__name__}:{exc}')
          PY
