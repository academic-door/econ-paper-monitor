name: Daily vNext Browser Smoke

on:
  push:
    branches: ["codex/**"]
  pull_request:
    paths:
      - "docs/**"
      - "scripts/build_daily_vnext.py"
      - "scripts/display_contract.py"
      - "scripts/render_site.py"
      - "scripts/templates/daily_vnext.html"
      - "tests/daily_vnext_public_smoke.mjs"
      - "tests/test_public_product_audit_contract.py"
      - ".github/workflows/daily-vnext-browser-smoke.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  browser-smoke:
    name: browser-smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            viewport_width: 1440
          - name: mobile
            viewport_width: 390
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_run') && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate local site fixtures
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          DAILY_DATE=$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d")
          today_path = Path("data/daily") / f"{today}.json"
          try:
              if isinstance(json.loads(today_path.read_text(encoding="utf-8")), list):
                  print(today)
                  raise SystemExit
          except (OSError, ValueError):
              pass
          for path in sorted(Path("data/daily").glob("*.json"), reverse=True):
              try:
                  if json.loads(path.read_text(encoding="utf-8")):
                      print(path.stem)
                      break
              except (OSError, ValueError):
                  continue
          else:
              raise SystemExit("No canonical daily archive available")
          PY
          )
          python scripts/render_site.py
          python scripts/build_daily_vnext.py --date "$DAILY_DATE" --output docs/index.html --report "$RUNNER_TEMP/daily-home-report.json"
          python scripts/build_daily_vnext.py --date "$DAILY_DATE" --output docs/daily-vnext/index.html --report "$RUNNER_TEMP/daily-vnext-report.json"
      - name: Start local static server
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python -m http.server 8765 --directory docs > /tmp/daily-vnext-http.log 2>&1 &
      - name: Run public browser smoke
        env:
          DAILY_VNEXT_URL: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'http://127.0.0.1:8765/' || 'https://academic-door.github.io/econ-paper-monitor/' }}
          VIEWPORT_WIDTH: ${{ matrix.viewport_width }}
        run: node tests/daily_vnext_public_smoke.mjs
