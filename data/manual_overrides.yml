  # ② G23 N2 #412: verified public abstract excerpts from exact first-party Springer Nature Link article pages.
  # Source independently readable via Exa web_fetch_exa on 2026-10-29; match exact DOI, title, online date, full Abstract section.
  # No changes to first_seen, published_online, available_online, date_source, authors, or article identity.
  # https://link.springer.com/article/10.1007/s10797-026-10011-7 ; online 2026-10-27; abstract_chars=1542
  "10.1007/s10797-026-10011-7":
    abstract: "The literature on optimal robot taxes generally uses model environments in which the displacement effect of automation does not lead to involuntary unemployment. In this paper, we study optimal taxation of robotic capital in an environment in which a binding minimum wage makes involuntary unemployment a long-run equilibrium outcome. In our dynamic general equilibrium model with heterogeneous worker groups and income redistribution, the robot tax is a key determinant of the equilibrium shares of unemployed and minimum-wage workers. Our theoretical contribution is a closed-form solution for the lowest robot tax rate that blocks automation when the minimum wage is binding. We then calibrate the model to the United States and compute optimal robot taxes. Restricted to linear income taxation, the Ramsey planner sets a positive robot tax that distorts the assignment of tasks between workers and robotic capital to the point at which no task is automated. This second-best policy maximizes social welfare along a balanced growth path, at a small efficiency cost. The aggregate welfare gain relative to the status quo is an extensive-margin effect: the robot tax reallocates some of the unemployed workers from unemployment insurance into employment. We also show that an optimized income tax-subsidy system and an optimal robot tax are complements in creating welfare gains, whereas a non-binding minimum wage closes the reallocation channel by eliminating involuntary unemployment. Alternative calibrations do not alter these findings."
    abstract_source: "publisher_page_verified"
  # https://link.springer.com/article/10.1007/s10797-026-10004-6 ; online 2026-10-27; abstract_chars=888
  "10.1007/s10797-026-10004-6":
    abstract: "This paper argues that an individual region’s local public goods (LPGs) function as a double-edged sword for other regions: while they generate familiar positive spillovers, they simultaneously provoke regional concern over relative provision. Armed with this novel insight, we revisit the classical public-finance problem of LPG provision. We demonstrate that once LPGs are modeled as a double-edged sword, the direction of bias under decentralized versus centralized provision — whether undersupply or oversupply — is theoretically ambiguous. Crucially, this indeterminacy persists irrespective of whether the social planner accounts for regional concern over relative LPG provision. Beyond its theoretical implications, our framework provides a natural economic rationale for prominent real-world phenomena, specifically the widespread emergence and proliferation of gated communities."
    abstract_source: "publisher_page_verified"
  # https://link.springer.com/article/10.1007/s10797-026-10009-1 ; online 2026-10-24; abstract_chars=1081
  "10.1007/s10797-026-10009-1":
    abstract: "This paper examines how different framings of information about social norms affect tax compliance. We test how people respond to information about what others do and what others believe should be done. In a laboratory experiment with voluntary income reporting, participants received messages describing honest or dishonest behavior, or approval or disapproval of tax evasion. The results show that the effects of these messages depend heavily on how they are framed. A permissive message suggesting that tax evasion can sometimes be acceptable was associated with more evasion. Even a seemingly positive message stating that most people reported their income honestly appeared to backfire, although this result was less consistent. The other messages had little effect. For tax authorities, social-norm messages should not be treated as a simple, low-risk way to improve compliance. Their content and likely interpretation should be tested carefully before implementation, as messages that inadvertently legitimize non-compliance may weaken rather than strengthen tax compliance."
    abstract_source: "publisher_page_verified"
  # https://link.springer.com/article/10.1007/s10797-026-10008-2 ; online 2026-10-24; abstract_chars=1650
  "10.1007/s10797-026-10008-2":
    abstract: "Value-added tax (VAT) systems in EU Member States deviate substantially from a uniform-rate benchmark through reduced rates and exemptions, typically motivated by distributional concerns. This paper provides microsimulation evidence on the fiscal and distributional effects of the full set of VAT expenditures, including both reduced rates and the non-actionable exemption gap covering healthcare, education and financial services mandated by the EU VAT Directive, in five major EU economies (Germany, France, Italy, Spain and Poland) under the 2024 policy baseline. Using EUROMOD and its Indirect Tax Tool with EU-SILC 2022 microdata matched with EU-HBS 2015 expenditure data, and following a compensating variation welfare approach, we simulate a universal standard-rate VAT counterfactual and find that abolishing all VAT expenditures would reduce post-consumption-tax disposable income by 9–21% for bottom-decile households versus 3–5% for the top decile, with Italy and Spain displaying the most regressive reform-cost profiles. The difference in welfare loss between the bottom and top income deciles ranges from − 6.3 percentage points in Poland to − 16.3 percentage points in Italy. While VAT expenditures offer meaningful purchasing-power protection to lower-income households in proportional terms, this protection is poorly targeted in absolute terms because richer households capture a larger share of the implicit subsidy in absolute cash terms, and could be replicated more efficiently through targeted income transfers. We discuss implications for revenue-neutral VAT reform and the efficiency–equity trade-off in EU indirect taxation."
    abstract_source: "publisher_page_verified"
  # https://link.springer.com/article/10.1007/s10797-026-09999-9 ; online 2026-10-24; abstract_chars=532
  "10.1007/s10797-026-09999-9":
    abstract: "Governments provide incentives for the transition to a green economy. Often, such policies include the subsidization for the purchase of environmentally friendly products. We examine the effectiveness of such green policies when consumers are environmentally conscious and pay limited attention to subsidies. We study the effect of subsidy salience on firms’ environmental product qualities, pollution levels and subsidy pass-through. Moreover, we describe the optimal policy mix when the government can increase salience at a cost."
    abstract_source: "publisher_page_verified"
  # https://link.springer.com/article/10.1007/s10797-026-10010-8 ; online 2026-10-22; abstract_chars=1455
  "10.1007/s10797-026-10010-8":
    abstract: "The issue of year-end spending surges is a persistent challenge in modern budgetary systems, often resulting in non-standard use of fiscal resources and inefficient budget execution. Our paper examines the role of audit institutions in mitigating end-of-year government spending surges. Using monthly fiscal data for Chinese prefecture-level cities from 2010 to 2019 and examining the effects of vertical management reform of audit agencies using a difference-in-differences design, we find that enhanced audit independence significantly curbs year-end spending surges at the local government level. More independent audit bodies increased attention to delayed fund allocation and year-end spending surges. This change was accompanied by stronger detection of fiscal irregularities, penalties, and referrals to judicial or disciplinary authorities. Moreover, the reform also increased the shares of expenditure executed in the first three quarters, indicating a reallocation of expenditure toward earlier periods. The dampening effects are more pronounced in settings where delays in budget execution are more difficult to monitor and alternative forms of fiscal oversight are weaker. Further evidence suggests that local governments subject to more independent audit oversight achieve higher fiscal expenditure efficiency. These findings highlight the previously underexplored role of audit agency independence in governing end-of-year spending behavior."
    abstract_source: "publisher_page_verified"


