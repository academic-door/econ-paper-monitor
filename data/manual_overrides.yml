  # https://www.tandfonline.com/doi/full/10.1080/00036846.2026.2753036 ; Published online: 28 Oct 2026; abstract_chars=1394
  "10.1080/00036846.2026.2753036":
    abstract: "This study examines cross-country differences in the diffusion of renewable energy technologies (RET) by shifting the focus from traditional economic and technological explanations to the role of socio-political dynamics. Drawing on panel data from 107 countries from 2000 to 2023, the analysis combines Chow’s technology diffusion model with dynamic panel system GMM estimation to evaluate how socio-political conflict and a country’s conflict management capacity influence RET diffusion. The findings indicate that RET diffusion is slower in countries with strong entrenched interests in conventional energy sectors and pronounced economic or ideological divisions. Conversely, countries with greater conflict resolution capacities – such as high levels of social capital and effective governance – experience faster RET diffusion. These findings are further supported by analyses of eight composite social conflict indices, which capture aspects of vested interests, conflict intensity, and conflict-resolution strength, and the results are robust to an alternative measure of diffusion and to the exclusion of influential countries. Estimates for control variables such as electricity prices and carbon pricing are consistent with previous findings. Overall, our study underscores the critical role of socio-political factors in shaping the speed and success of national energy transitions."
    abstract_source: "publisher_page_verified"
  # https://www.tandfonline.com/doi/full/10.1080/00036846.2026.2747147 ; Published online: 28 Oct 2026; abstract_chars=1202
  "10.1080/00036846.2026.2747147":
    abstract: "Using the 2022 wave of the China Family Panel Studies (CFPS) and a fuzzy regression-discontinuity (RDD) design at the statutory retirement age, this article estimates the local causal effect of retirement on household consumption and portfolio allocation. We find that retirement triggers a significant reallocation of household budgets. On the consumption side, total expenditure declines by 2.9%. This aggregate decrease is driven by a 4.0% reduction in work-related expenditure and a 2.6% fall in other nondurable expenditures, alongside a more modest 1.4% decrease in food and clothing expenditure. Conversely, recreation and leisure expenditures rise substantially by 3.2%. On the asset side, households shift towards safer and more liquid holdings – demand and term deposits increase by about 11.2% and 6.4%, respectively – accompanied by a significant expansion in housing wealth. Mechanism analysis reveals that changes in time use and heightened precautionary motives underpin these behavioural shifts. The results, robust to a range of checks, are local to compliers induced by the age-60 eligibility rule and inform the design of pension systems and the ‘silver economy’ in ageing societies."
    abstract_source: "publisher_page_verified"
