    stage: 2
    homepage: https://ideas.repec.org/s/oec/ecoaaa.html
    official_homepage: https://www.oecd-ilibrary.org/economics/oecd-economics-department-working-papers_18151973
    url_pattern: "/p/oec/ecoaaa/"
    url_contains:
      - /p/oec/ecoaaa/
    fields:
      - public
      - macro
      - labor
      - environment

  - id: ecb-working-papers
    title: European Central Bank Working Papers
    chinese_name: 欧洲中央银行工作论文
    type: working_paper
    stage: 2
    homepage: https://ideas.repec.org/s/ecb/ecbwps.html
    url_pattern: "/p/ecb/ecbwps/"
    url_contains:
      - /p/ecb/ecbwps/
    fields:
      - macro
